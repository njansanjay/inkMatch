apply plugin: 'com.android.application'

android {
    namespace = "com.inkprint.app"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }

    def localProperties = [:]
    def localEnvironmentFile = rootProject.file('../.env')
    if (localEnvironmentFile.exists()) {
        localEnvironmentFile.readLines('UTF-8').each { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def separator = trimmed.indexOf('=')
                def key = trimmed.substring(0, separator).trim()
                def value = trimmed.substring(separator + 1).trim()
                if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")))) {
                    value = value.substring(1, value.length() - 1)
                }
                localProperties[key] = value
            }
        }
    }
    def webClientId = localProperties['GOOGLE_WEB_CLIENT_ID'] ?: System.getenv('GOOGLE_WEB_CLIENT_ID') ?: ''
    def escapedWebClientId = webClientId.replace('\\', '\\\\').replace('"', '\\"')
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
        if (!webClientId.matches('^[A-Za-z0-9._-]+\\.apps\\.googleusercontent\\.com$')) {
            throw new GradleException('Set GOOGLE_WEB_CLIENT_ID in the local .env to a Firebase-enabled Web OAuth client ID before building a release.')
        }
        def servicesFile = file('google-services.json')
        if (!servicesFile.exists()) {
            throw new GradleException('Add the Firebase Android google-services.json for com.inkprint.app before building a release.')
        }
        def services = new groovy.json.JsonSlurper().parse(servicesFile)
        def configuredProjectId = localProperties['FIREBASE_PROJECT_ID']
        if (configuredProjectId && services.project_info?.project_id != configuredProjectId) {
            throw new GradleException('FIREBASE_PROJECT_ID in .env must match the project in google-services.json.')
        }
        def hasAndroidApp = services.client.any { entry ->
            entry.client_info?.android_client_info?.package_name == 'com.inkprint.app'
        }
        if (!hasAndroidApp) {
            throw new GradleException('google-services.json must register the Android app com.inkprint.app.')
        }
        def hasAndroidOAuthClient = services.client.any { entry ->
            entry.client_info?.android_client_info?.package_name == 'com.inkprint.app'
                    && entry.oauth_client?.any { it.client_type == 1 }
        }
        if (!hasAndroidOAuthClient) {
            throw new GradleException('google-services.json must include the Android OAuth client for the release signing SHA-1 fingerprint.')
        }
        def hasWebClient = services.client.any { entry ->
            (entry.oauth_client ?: []).any { it.client_type == 3 && it.client_id == webClientId }
                    || (entry.services?.appinvite_service?.other_platform_oauth_client ?: [])
                    .any { it.client_type == 3 && it.client_id == webClientId }
        }
        if (!hasWebClient) {
            throw new GradleException('google-services.json must include this Firebase-enabled Web OAuth client.')
        }
    }

    defaultConfig {
        applicationId "com.inkprint.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "2.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', "\"${escapedWebClientId}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply plugin: 'com.google.gms.google-services'

def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
if (releaseSigningPropertiesFile.exists()) {
    def releaseSigningProperties = new Properties()
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
    android.signingConfigs.create('release') {
        storeFile rootProject.file(releaseSigningProperties['storeFile'])
        storePassword releaseSigningProperties['storePassword']
        keyAlias releaseSigningProperties['keyAlias']
        keyPassword releaseSigningProperties['keyPassword']
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.release
}
